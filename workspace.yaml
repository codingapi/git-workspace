# Workspace Projection Layer 声明式配置
# 语法见 README;修改后执行 `./workspace sync` 生效

version: 1

sources:
  # path = 真实 worktree 在工程中的装配位置(IDE 打开工程根目录即可开发/构建)
  # 装配位置同时也是 git 过滤边界:引擎自动让外层仓库与父仓库忽略它,无需手工配置
  # 升级 = 改 revision → sync → 验证 → 连 lock 一起提交(显式事件,不漂移)
  flow-engine:
    url: git@github.com:codingapi/flow-engine.git
    revision: v0.0.66
    path: flow-engine

  # 嵌套装配:前端是后端工程的 web 部分;父仓库自动忽略该目录
  flow-frontend:
    url: git@github.com:codingapi/flow-frontend.git
    revision: v0.0.67
    path: flow-engine/web

  # 消费型依赖:钉 tag + sparse + 文件系统只读,唯一写入者是 workspace sync
  fastjson2:
    url: git@github.com:alibaba/fastjson2.git
    revision: 2.0.63
    path: frameworks/fastjson2
    sparse: [core]
    readonly: true
